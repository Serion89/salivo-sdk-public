ShortDescription: Compiled systems language with a self-hosted compiler, deterministic cleanup, and built-in web, UI and game libraries.
Description: Salivo is a compiled systems language that lets one developer build command-line tools, web APIs, browser frontends and desktop games in a single language. It has no garbage collector and no manual memory management, compiles to small native executables or WebAssembly, and ships a standard library with an HTTP server, SQL databases, JSON, regex, cryptography, a reactive WebAssembly UI framework and a game engine. The SDK includes the compiler (sf), package manager (spm), language server, formatter, linter and documentation tool, plus a VS Code extension.
